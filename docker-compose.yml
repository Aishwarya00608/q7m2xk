services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: ./.env
        required: false
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - "5173:80"
